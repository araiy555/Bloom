# Render Blueprint — backend only.
# Frontend は Vercel に置き、DB は Neon の無料 Postgres を使う構成。
# 詳細は docs/DEPLOY.md を参照。
#
# 使い方:
#   1. Render Dashboard > New > Blueprint で本リポジトリを指定
#   2. NEON_DATABASE_URL / OPENAI_API_KEY などの値を入力（sync: false の項目）
#   3. Apply

services:
  - type: web
    name: bloom-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # 例: postgresql://user:pass@ep-xxx.neon.tech/bloom?sslmode=require
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEFAULT_PROVIDER
        value: openai
      - key: CORS_ORIGINS
        sync: false  # 例: https://your-app.vercel.app
      - key: UPLOAD_DIR
        value: /tmp/uploads  # Render free tier は再起動でディスクが消える点に注意
